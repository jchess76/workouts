<style>
:root{
  --bg:#0b100d;--bg2:#111814;--card:#161f1a;--card2:#1c2721;--line:#26332c;
  --text:#e9f2ed;--muted:#8fa198;--dim:#62736a;
  --green:#22c55e;--green2:#16a34a;--greenbg:rgba(34,197,94,.13);
  --amber:#f59e0b;--amberbg:rgba(245,158,11,.14);--red:#ef4444;--redbg:rgba(239,68,68,.14);
  --blue:#60a5fa;--r:16px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--green)}
.hidden{display:none!important}
#app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 96px)}
body.resting #app{padding-bottom:calc(var(--sab) + 176px)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 14px}
header.top h1{font-size:30px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.5px}
header.top .sub{color:var(--muted);font-size:14px;margin-top:3px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card h2{font-size:18px;margin:0 0 6px}
.card h3{font-size:15px;margin:0 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.banner{border-radius:14px;padding:12px 14px;margin:0 0 12px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.banner b{display:block;font-size:15px;margin-bottom:2px}
.banner.green{background:var(--greenbg);border:1px solid rgba(34,197,94,.35)}
.banner.amber{background:var(--amberbg);border:1px solid rgba(245,158,11,.4)}
.banner.red{background:var(--redbg);border:1px solid rgba(239,68,68,.4)}
.banner.blue{background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.35)}
.banner .ico{font-size:20px;line-height:1.1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;padding:0 18px;font-weight:700;font-size:17px;background:var(--card2);border:1px solid var(--line);width:100%}
.btn.primary{background:var(--green);color:#04210f;border-color:var(--green)}
.btn.primary:active{background:var(--green2)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--redbg);color:#fecaca;border-color:rgba(239,68,68,.45)}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px;width:auto}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px} .btns>*{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.pill.green{color:var(--green);background:var(--greenbg);border-color:rgba(34,197,94,.35)}
.pill.amber{color:var(--amber);background:var(--amberbg);border-color:rgba(245,158,11,.4)}
.pill.red{color:#fca5a5;background:var(--redbg);border-color:rgba(239,68,68,.4)}
.hero{background:linear-gradient(145deg,#153322,#0f1f16 60%,#101813);border:1px solid rgba(34,197,94,.35);border-radius:22px;padding:18px;margin-bottom:12px}
.hero .daytag{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--green);color:#04210f;font-weight:900;font-size:22px}
.hero h2{margin:0;font-size:22px}
.hero ul{list-style:none;padding:0;margin:14px 0 16px}
.hero li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:15px}
.hero li:last-child{border-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;min-width:56px;padding:0 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip.on{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.chip.locked{opacity:.5}
.locked-card{opacity:.75;background:repeating-linear-gradient(135deg,#141a17 0 12px,#121714 12px 24px)}
.stat{flex:1;background:var(--card2);border-radius:14px;padding:12px;text-align:center;border:1px solid var(--line)}
.stat .v{font-size:24px;font-weight:800} .stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
/* toggle */
.toggle{position:relative;width:56px;height:34px;flex:none}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle span{position:absolute;inset:0;background:#33413a;border-radius:34px;transition:.2s}
.toggle span:before{content:"";position:absolute;width:28px;height:28px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--green)}
.toggle input:checked+span:before{transform:translateX(22px)}
/* workout */
.wo-head{position:sticky;top:0;z-index:5;background:rgba(11,16,13,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -16px 12px;padding:calc(var(--sat) + 8px) 16px 10px;border-bottom:1px solid var(--line)}
.ex{padding:14px}
.ex.done{border-color:rgba(34,197,94,.55)}
.ex .title{font-size:18px;font-weight:800;margin:0}
.ex .target{font-size:14px;color:var(--muted);margin-top:2px}
.ex .caution{color:var(--amber);font-size:13px;font-weight:700;margin-top:6px}
.sugg{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:14px;border-left:4px solid var(--dim)}
.sugg.up{border-left-color:var(--green)} .sugg.hold{border-left-color:var(--blue)} .sugg.flag{border-left-color:var(--amber)} .sugg.deload{border-left-color:#a78bfa}
.sugg b{font-size:15px}
.last{font-size:13px;color:var(--muted);margin:4px 0 8px}
details.cues{margin:6px 0 4px}
details.cues summary{color:var(--green);font-size:14px;font-weight:600;list-style:none;cursor:pointer;padding:6px 0}
details.cues summary::-webkit-details-marker{display:none}
details.cues ul{margin:4px 0 6px;padding-left:20px;color:#cfe0d6;font-size:14px}
details.cues li{margin:3px 0}
.exbtns{display:flex;gap:8px;margin:6px 0 10px}
.exbtns .btn{min-height:42px;font-size:14.5px;font-weight:700;border-radius:12px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 50px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setrow.bw{grid-template-columns:30px 1fr 50px}
.setrow.tbw{grid-template-columns:30px 1fr 96px 50px}
.setrow .holdline{grid-column:2 / 5}
.setrow .holdline .holdbtn{width:100%;height:42px}
.setrow .n{font-weight:800;color:var(--muted);text-align:center}
.setrow.isdone .n{color:var(--green)}
.stepper{display:flex;align-items:stretch;background:var(--bg2);border:1px solid var(--line);border-radius:12px;height:48px;overflow:hidden}
.stepper button{width:40px;font-size:22px;font-weight:700;color:var(--green);flex:none}
.stepper button:active{background:var(--card2)}
.stepper input{width:100%;min-width:0;text-align:center;background:transparent;border:0;font-weight:800;font-size:18px;outline:none;padding:0}
.stepper .u{align-self:center;font-size:11px;color:var(--dim);margin-left:-4px;margin-right:2px}
.check{width:50px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);display:grid;place-items:center}
.check svg{width:24px;height:24px;opacity:.25}
.check.on{background:var(--green);border-color:var(--green)}
.check.on svg{opacity:1;stroke:#04210f}
.holdbtn{height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:15px}
.holdbtn.running{background:var(--amberbg);border-color:var(--amber);color:var(--amber)}
.colhdr{display:grid;grid-template-columns:30px 1fr 1fr 50px;gap:8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;text-align:center;padding-bottom:4px}
.colhdr.bw{grid-template-columns:30px 1fr 50px}
.colhdr.tbw{grid-template-columns:30px 1fr 96px 50px}
.painrow{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
input[type=range]{width:100%;height:36px;-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,#22c55e 0%,#eab308 45%,#ef4444 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,#22c55e 0%,#eab308 45%,#ef4444 100%)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}
.feelgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feelbtn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:12.5px;font-weight:700;line-height:1.15;padding:4px 3px;color:var(--muted)}
.feelbtn.on{color:#04210f}

(function addVariations(){
  const INHERIT = ['day','mode','sets','repMin','repMax','main','joint','side','timed','secStep','help','needs'];
  for(const v of VARIATIONS){
    const base = DEFAULT_EXERCISES.find(e => e.slot === v.slot && e.std); if(!base) continue;
    const n = {}; for(const k of INHERIT) if(base[k] !== undefined) n[k] = base[k];
    Object.assign(n, v); if(n.bw){ n.startW = 0; n.inc = 0; }
    let at = -1; DEFAULT_EXERCISES.forEach((e, k) => { if(e.slot === v.slot) at = k; });
    DEFAULT_EXERCISES.splice(at + 1, 0, n);
  }
  const EXTRA_WARN = {   // older variations that also deserve a caution tag
    oh_cable_ext:[['shoulder'], 'Arms overhead with the elbows fully bent puts the shoulder in a deep stretch; skip it if that pinches'],
    pallof_oh:[['shoulder'], 'The overhead reach can pinch the shoulder; only reach as high as is pain-free']};
  for(const e of DEFAULT_EXERCISES){ const x = EXTRA_WARN[e.id]; if(x){ e.warn = x[0]; e.caution = x[1]; } }
  for(const e of DEFAULT_EXERCISES){   // dumbbell weights are always per hand
    if(/\bDB\b/.test(e.name) && !(e.cues||[]).some(c => /per hand/i.test(c))) e.cues = [...(e.cues||[]), 'Weight is per hand'];
  }
})();

function freshState(){
  return {v:1, programVersion:PROGRAM_VERSION, settings:{startDate:null, units:'lb', restDefault:90, ptCleared:false, bikeStartRes:2, mode:'bjj', neckIsoCleared:false, machinesOnly:true, swaps:{}, daySwaps:{date:null, map:{}}},
          exercises: JSON.parse(JSON.stringify(DEFAULT_EXERCISES)), sessions:[], bike:[], current:null};
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(!raw) return freshState();
    const s = JSON.parse(raw); const f = freshState();
    s.settings = Object.assign(f.settings, s.settings||{});
    s.exercises = Array.isArray(s.exercises) ? s.exercises : f.exercises;
    if((+s.programVersion||1) < PROGRAM_VERSION){ s.exercises = migrateExercises(s.exercises); s.programVersion = PROGRAM_VERSION; }
    s.sessions = s.sessions||[]; s.bike = s.bike||[]; if(s.current===undefined) s.current=null;
    return s;
  }catch(e){ console.error(e); return freshState(); }
}
/* Program upgrade: a phone keeps its exercise list in localStorage, so without this a program update would never reach it
   (and lists saved before modes existed had no mode tags, so both modes showed the same exercises). New defaults replace old ones;
   custom exercises and edited increments are kept; history is keyed by exercise id and never touched. */
function migrateExercises(old){
  const defIds = new Set(DEFAULT_EXERCISES.map(e => e.id));
  const oldById = new Map(old.filter(e => e && e.id).map(e => [e.id, e]));
  const out = DEFAULT_EXERCISES.map(d => { const n = JSON.parse(JSON.stringify(d)); const o = oldById.get(d.id);

  for(const e of old){

    let at = -1; out.forEach((x, k) => { if(x.day === e.day) at = k; });

/* ---------- progression engine ---------- */
function entriesFor(exId){ // chronological list of {session, item}
  const out = [];
  for(const s of S.sessions){ for(const it of s.items){ if(it.exId === exId) out.push({s, it}); } }
  out.sort((a,b) => (a.s.date+a.s.finishedAt).localeCompare(b.s.date+b.s.finishedAt));
  return out;
}
function doneSets(it){ return it.sets.filter(x => x.done); }
function unitOf(o){ return o.timed ? (o.bw ? 's' : ' '+U()) : (o.bw ? ' reps' : ' '+U()); }
/* "top" per session: weight for loaded moves, longest hold for bodyweight holds, most reps for bodyweight/band moves */
function topOf(it){ const d = doneSets(it); if(!d.length) return null;
  if(it.bw) return Math.max(...d.map(x=>+x.r||0)); return Math.max(...d.map(x=>+x.w||0)); }
function hitTop(it){
  const d = doneSets(it);
  return d.length >= (it.planned||it.sets.length) && d.every(x => (+x.r||0) >= it.repMax);
}
function lastText(it){
  const d = doneSets(it); if(!d.length) return '';
  const parts = d.map(x => it.timed ? (it.bw ? x.r+'s' : fmtW(x.w)+'×'+x.r+'s') : (it.bw ? x.r+' reps' : fmtW(x.w)+'×'+x.r));
  return parts.join(', ') + (it.pain ? ' · pain '+it.pain : '');
}
/* Feel buttons: delta in increments. */
const FEEL = {wayLight:{d:2, label:'Way too light'}, light:{d:1, label:'Too light'}, right:{d:0, label:'Just right'}, heavy:{d:-1, label:'Too heavy'}, wayHeavy:{d:-2, label:'Way too heavy'}};
const feelD = f => (FEEL[f] ? FEEL[f].d : 0);
function workEntries(exId){ return entriesFor(exId).filter(e => doneSets(e.it).length && !e.s.deload); }
/* Calibrating = first 3 sessions, unless marked "Just right" twice in a row. `n` = number of logged sessions to consider. */
function isCalibrating(exId, n){
  const W = workEntries(exId); const L = (n==null) ? W : W.slice(0, n);
  if(L.length >= 3) return false;
  return !(L.length >= 2 && L[L.length-1].it.feel==='right' && L[L.length-2].it.feel==='right');
}
function stepFor(ex){ return (+ex.inc > 0) ? +ex.inc : 2.5; }
function feelReason(delta, step, feel){
  const lbl = FEEL[feel] ? FEEL[feel].label.toLowerCase() : '';
  if(delta > 0) return `Up ${fmtW(delta*step)} ${U()}: you marked it ${lbl}.`;
  if(delta < 0) return `Down ${fmtW(-delta*step)} ${U()}: you marked it ${lbl}.`;
  return 'Same weight: you marked it just right.';
}
/* Double progression + feel calibration. Returns {w, secs, kind:'new'|'up'|'hold'|'flag'|'deload', reason, perSetReps, lastAny, calibrating}. */
function suggest(ex, week){
  const all = entriesFor(ex.id).filter(e => doneSets(e.it).length);
  const lastAny = all[all.length-1] || null;
  const work = all.filter(e => !e.s.deload);            // progression ignores deload sessions
  const last = work[work.length-1] || null;
  const inc = +ex.inc || 0, step = stepFor(ex), sstep = +ex.secStep || 5;
  const early = week <= 2;
  const res = {w:0, secs:null, kind:'new', reason:'', lastAny, last, perSetReps:null, calibrating: isCalibrating(ex.id)};
  if(!last){
    res.kind = 'new'; res.w = ex.bw ? 0 : (+ex.startW || 0); res.secs = ex.timed ? ex.repMin : null;
    res.reason = ex.bw ? (ex.timed ? `First time: easy ${ex.repMin}s holds. Use the feel buttons to dial it in.` : 'First time: smooth, controlled reps. Use the feel buttons to dial it in.')
                       : 'Use the feel buttons to dial it in.' + (early ? ' Weeks 1-2: leave 3-4 reps in reserve.' : '');
  } else {
    const it = last.it, pain = +it.pain || 0, top = hitTop(it);
    const feel = it.feel || '', d = feelD(feel);
    const calib = isCalibrating(ex.id, work.length - 1);  // was the last session a calibration session?
    const done = doneSets(it);
    const wTop = ex.bw ? 0 : Math.max(...done.map(x=>+x.w||0));
    const minR = Math.min(...done.map(x=>+x.r||0));
    // base weight the feel was judged at; a weight typed after tapping feel overrides it
    let base = (it.feelBase!=null && !ex.bw) ? +it.feelBase : wTop;
    if(it.manualAfterFeel && !ex.bw) base = +done[done.length-1].w || wTop;
    res.w = wTop;
    if(ex.bw){
      // bodyweight/band: feel adjusts hold time (timed) or gives a variation cue
      if(pain >= 4){ res.kind='flag'; if(ex.timed) res.secs = Math.max(10, Math.min(minR, ex.repMin)); res.reason = `Pain was ${pain}/10 last time. Keep it easy, and check with your PT if it keeps happening.`; }
      else if(ex.timed){
        if(d){ res.secs = Math.max(10, minR + d*sstep); res.kind = d>0?'up':'flag'; res.reason = `${d>0?'Longer':'Shorter'} holds: you marked it ${FEEL[feel].label.toLowerCase()}.`; }
        else if(top){ res.kind='up'; res.secs = ex.repMax; res.reason = `You hit ${ex.repMax}s on all sets. Hold there, or make it harder only if your neck and shoulders feel good.`; }
        else if(early && !d){ res.kind='hold'; res.secs = minR; res.reason = 'Weeks 1-2: same hold time. Tap Too light if it’s easy.'; }
        else { res.kind='hold'; res.secs = Math.min(ex.repMax, minR + sstep); res.reason = `Build holds toward ${ex.repMax}s (+${sstep}s).`; }
      } else {
        if(d < 0){ res.kind='flag'; res.reason = `You marked it ${FEEL[feel].label.toLowerCase()}: use an easier version (lighter band, shorter range).`; }
        else if(d > 0 || top){ res.kind='up'; res.reason = d>0 ? `You marked it ${FEEL[feel].label.toLowerCase()}: slow the tempo (3 seconds down) or use a stronger band.` : `You hit ${ex.repMax} on all sets. Slow the tempo or use a stronger band.`; }
        else { res.kind='hold'; res.reason = `Aim for ${ex.repMax} reps on every set.`; res.perSetReps = done.map(x=>+x.r); }
      }
    } else if(pain >= 6){
      res.kind='flag'; res.w = Math.max(0, Math.min(base + Math.min(d,-1)*step, wTop - step)); if(ex.timed) res.secs = Math.max(10, Math.min(minR, ex.repMin));
      res.reason = `Pain was ${pain}/10 last time. Dropped the weight. Stop if it hurts, and talk to your PT or surgeon.`;
    } else if(pain >= 4){
      res.kind='flag'; res.w = Math.max(0, d < 0 ? base + d*step : Math.min(base, wTop)); if(ex.timed) res.secs = Math.max(10, Math.min(minR, ex.repMax));
      res.reason = `Pain was ${pain}/10 last time. No increase until pain stays under 4${d<0?'; also lowered because you marked it '+FEEL[feel].label.toLowerCase():''}.`;
    } else if(it.manualAfterFeel){
      res.w = base; res.kind='hold'; res.reason = `Using the ${fmtW(base)} ${U()} you typed last time (manual entry overrides feel).`;
    } else if(calib || early){
      // calibration / weeks 1-2: feel wins; no automatic rep-based increase in weeks 1-2
      if(feel){ res.w = Math.max(0, base + d*step); res.kind = d>0?'up':d<0?'flag':'hold'; res.reason = feelReason(d, step, feel) + (calib ? ' (calibrating)' : ''); }
      else if(early){ res.w = wTop; res.kind='hold'; res.reason = 'Weeks 1-2: no automatic increases. Tap Too light if it feels easy.'; }
      else if(top && inc>0){ res.w = wTop + inc; res.kind='up'; res.reason = `You hit ${ex.repMax}${ex.timed?'s':' reps'} on all sets → +${fmtW(inc)} ${U()} (calibrating: tap a feel button to fine-tune).`; }
      else { res.w = wTop; res.kind='hold'; res.reason = 'Calibrating: same weight. Tap a feel button to dial it in.'; }
    } else {
      // calibrated: normal double progression, with feel overrides
      if(d < 0){ res.w = Math.max(0, base + d*step); res.kind='flag'; res.reason = feelReason(d, step, feel) + ' No increase.'; }
      else if(feel==='wayLight'){ res.w = base + (top?2:1)*step; res.kind='up'; res.reason = `Up ${fmtW((top?2:1)*step)} ${U()}: ${top?'top of the range plus an extra increment, because ':''}you marked it way too light.`; }
      else if(top && inc>0){ res.w = wTop + inc; res.kind='up'; res.reason = `You hit ${ex.repMax}${ex.timed?'s':' reps'} on all sets → +${fmtW(inc)} ${U()}.`; }
      else if(top){ res.w = wTop; res.kind='up'; res.reason = 'Top of the range. The increment is 0, so add a little load or slow the tempo if it feels easy.'; }
      else { res.w = wTop; res.kind='hold'; res.reason = `Same weight. Aim for ${ex.repMax}${ex.timed?'s':' reps'} on every set before adding weight.`; }
    }
    if(!ex.bw){
      res.w = round25(res.w);
      if(ex.timed && res.secs==null) res.secs = res.w > wTop ? ex.repMin : (top ? ex.repMax : Math.min(ex.repMax, minR + sstep));
      if(!ex.timed && res.w === wTop) res.perSetReps = done.map(x=>+x.r);
    }
  }
  if(isDeload(week)){
    if(!ex.bw && res.w > 0){ res.kind='deload'; res.w = round25(res.w*0.7); res.perSetReps=null; res.reason = 'Deload week: 70% of your working weight. Easy, crisp reps.'; }
    else if(ex.timed && ex.bw){ res.kind='deload'; res.secs = Math.max(10, Math.round((res.secs||ex.repMin)*0.7)); res.reason = 'Deload week: about 70% of your usual hold time.'; }
    else if(ex.bw){ res.kind='deload'; res.reason = 'Deload week: easy effort, lighter band, fewer hard reps.'; }
  }
  return res;
}

/* ---------- bike suggestion ---------- */
function bikeSuggest(){
  const L = [...S.bike].sort((a,b)=>(a.date+a.t).localeCompare(b.date+b.t));
  const startRes = +S.settings.bikeStartRes || 2;
  if(!L.length) return {min:12, res:startRes, kind:'new', reason:'Start with 10-15 minutes at low resistance and an easy spin. Only once the bike is cleared by your surgeon or PT.'};
  const latest = L[L.length-1]; const cw = weekOf(todayISO());
  const wk = e => weekOf(e.date);
  if(+latest.knee >= 4) return {min:Math.max(10, (+latest.min) - 5), res:Math.max(1, +latest.res), kind:'flag', reason:'Knee felt '+latest.knee+'/10 last ride. Back off 5 min and keep resistance low. If it stays irritated, check with your PT.'};
  const thisWeek = L.filter(e => wk(e) === cw);
  if(thisWeek.some(e => +e.knee >= 4)){ const m = Math.max(...thisWeek.map(e=>+e.min)); return {min:Math.max(10,m-5), res:+latest.res, kind:'flag', reason:'Knee flared this week. Hold or reduce time until it calms down.'}; }
  if(thisWeek.length){ const m = Math.max(...thisWeek.map(e=>+e.min)); const r = Math.max(...thisWeek.map(e=>+e.res)); return {min:m, res:r, kind:'hold', reason:'Repeat this week’s dose. Add time next week if your knee stays calm (under 4).'}; }
  const prevWeeks = L.filter(e => wk(e) < cw); const pw = Math.max(...prevWeeks.map(wk)); const P = prevWeeks.filter(e => wk(e) === pw);
  const M = Math.max(...P.map(e=>+e.min)); const R = Math.max(...P.map(e=>+e.res));
  const calm = P.every(e => +e.knee < 4);
  if(!calm) return {min:M, res:R, kind:'hold', reason:'Your knee wasn’t fully calm last week, so repeat that dose.'};
  if(M >= 35) return {min:30, res:R+1, kind:'up', reason:'You’ve reached about 35 min with a calm knee. Raise resistance 1 level and drop to 30 min, then build back up.'};
  const next = Math.min(35, M + 3);
  return {min:next, res:R, kind:'up', reason:'Knee stayed calm last week → add 2-5 min (suggested '+next+' min, max about 35). Same resistance.'};
}

/* Mode switch. If a lifting workout is in progress, re-plan it for the new mode: exercises you haven't touched are swapped,

function replanCurrent(m){
  const c = S.current; holdT = null;
  const onDay = it => (exById(it.exId)?.day || c.day) === c.day;
  const dayItems = c.items.filter(onDay), others = c.items.filter(it => !onDay(it));
  const byId = new Map(dayItems.map(it => [it.exId, it]));
  const plan = exercisesForDay(c.day, false, m); const planIds = new Set(plan.map(e => e.id));
  const next = plan.map(ex => byId.get(ex.id) || makeItem(ex, c.week));
  const keep = dayItems.filter(it => !planIds.has(it.exId) && itemTouched(it));
  const added = plan.filter(ex => !byId.has(ex.id)).length, removed = dayItems.filter(it => !planIds.has(it.exId) && !itemTouched(it)).length;
  c.items = [...next, ...keep, ...others]; c.mode = m;

}

let rerendering = false;

function updateWoHead(){ const c=S.current; if(!c) return; const p = document.querySelector('.wo-head .pill'); if(!p) return; const d=c.items.reduce((a,it)=>a+doneSets(it).length,0), t=c.items.reduce((a,it)=>a+it.sets.length,0); p.textContent = d+'/'+t+' sets'; p.classList.toggle('green', d===t); }
function startRest(sec){ const c=S.current; if(!c) return; c.restEnd = Date.now() + (sec||c.rest)*1000; c.restBeeped=false; save(); renderRest(); }
function renderRest(){
  const bar = $('#restbar'); const c = S.current;

  bar.classList.remove('hidden'); document.body.classList.add('resting');
  const left = Math.round((c.restEnd - Date.now())/1000);

function finishWorkout(){

/* ---------- charts (inline SVG, no libraries) ---------- */
let chartN = 0;
function lineChart(pts, opt={}){
  const W=340, H=190, L=40, R=14, T=16, B=28; chartN++;
  if(!pts.length) return `<div class="muted small" style="padding:26px 0;text-align:center">No data yet. Log a few sessions to see your trend.</div>`;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if(x0===x1){ x0 -= 86400000*3; x1 += 86400000*3; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = Math.max(2.5, (y1-y0)*0.15); y0 = Math.max(0, y0-padY); y1 = y1+padY;
  const X = x => L + (x-x0)/(x1-x0)*(W-L-R), Y = y => T + (1-(y-y0)/(y1-y0))*(H-T-B);
  let grid=''; for(let k=0;k<=3;k++){ const v = y0 + (y1-y0)*k/3; const yy = Y(v); grid += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#26332c" stroke-width="1"/><text x="${L-6}" y="${yy+4}" fill="#62736a" font-size="10" text-anchor="end">${Math.round(v)}</text>`; }
  const path = pts.map((p,k)=>(k?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area = path + ` L${X(pts[pts.length-1].x).toFixed(1)} ${H-B} L${X(pts[0].x).toFixed(1)} ${H-B} Z`;
  const d = t => { const dt = new Date(t); return (dt.getMonth()+1)+'/'+dt.getDate(); };
  const lp = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'chart')}"><defs><linearGradient id="cg${chartN}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${opt.color||'#22c55e'}" stop-opacity=".35"/><stop offset="1" stop-color="${opt.color||'#22c55e'}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#cg${chartN})"/><path d="${path}" fill="none" stroke="${opt.color||'#22c55e'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="${p.flag?'#f59e0b':'#0b100d'}" stroke="${p.flag?'#f59e0b':(opt.color||'#22c55e')}" stroke-width="2"/>`).join('')}
    <text x="${L}" y="${H-8}" fill="#62736a" font-size="10">${d(pts[0].x)}</text><text x="${W-R}" y="${H-8}" fill="#62736a" font-size="10" text-anchor="end">${d(lp.x)}</text>
    <text x="${Math.min(W-R, X(lp.x))}" y="${Math.max(12, Y(lp.y)-10)}" fill="#e9f2ed" font-size="11" font-weight="700" text-anchor="end">${fmtW(lp.y)}${opt.unit||''}</text></svg>`;
}

/* ---------- PROGRESS / HISTORY ---------- */
function vProgress(){
  const seg = `<div class="seg"><button class="${progSeg==='progress'?'on':''}" data-a="seg" data-s="progress">Progress</button><button class="${progSeg==='history'?'on':''}" data-a="seg" data-s="history">History</button></div>`;
  let body = '';
  if(progSeg==='history'){
    const L = [...S.sessions].sort((a,b)=>(b.date+b.finishedAt).localeCompare(a.date+a.finishedAt));
    body = L.length ? L.map(s => { const vol = s.items.filter(i=>!i.timed&&!i.bw).reduce((a,it)=>a+it.sets.filter(x=>x.done).reduce((b,x)=>b+x.w*x.r,0),0);
      return `<details class="card sess"><summary class="row"><div class="daybadge">${s.day}</div><div class="grow"><b>${esc(dayName(s.day, s.mode))}</b>${s.deload?' <span class="pill">Deload</span>':''}${s.mode?` <span class="modetag sm m-${s.mode}">${MODE_ICON[s.mode]} ${esc(MODES[s.mode])}</span>`:''}<div class="small muted">${fmtDate(s.date)} · week ${s.week} · ${s.items.length} exercises · vol ${vol.toLocaleString()} ${U()}</div></div><span class="muted">▾</span></summary>
      <div style="margin-top:10px">${s.items.map(it=>`<div class="kv"><div class="grow"><b class="small">${esc(it.name)}</b><div class="tiny muted">${esc(lastText(it))}${it.feel?' · felt '+esc(it.feel):''}${it.notes?' · '+esc(it.notes):''}</div></div>${hitTop(it)?'<span class="pill green">Top ✓</span>':''}${it.pain>=4?'<span class="pill amber">Pain '+it.pain+'</span>':''}</div>`).join('')}
      <div style="margin-top:10px"><button class="btn sm danger" data-a="sessdel" data-id="${s.id}">Delete session</button></div></div></details>`; }).join('')
      : '<div class="card muted">No workouts saved yet.</div>';
  } else {
    const ids = [...new Set([...S.exercises.map(e=>e.id), ...S.sessions.flatMap(s=>s.items.map(i=>i.exId))])];
    const rows = ids.map(id => { const E = entriesFor(id).filter(e=>doneSets(e.it).length); const ex = exById(id); const nm = ex ? ex.name : (E[0]?.it.name || id); const src = ex || E[0]?.it || {}; const un = unitOf(src).trim();
      if(!E.length && (!ex || !'ABCD'.includes(ex.day) || !modeOK(ex) || !gateOK(ex) || (ex.slot && !slotOK(ex)))) return null;
      const tops = E.map(e=>topOf(e.it)); return {id, nm, un, best: tops.length?Math.max(...tops):null, last: tops.length?tops[tops.length-1]:null, n:E.length, day: ex?ex.day:'–'}; }).filter(Boolean);
    rows.sort((x,y)=> (y.n>0)-(x.n>0) || 'ABCDMK'.indexOf(x.day)-'ABCDMK'.indexOf(y.day));
    if(!rows.find(r=>r.id===progEx)) progEx = rows[0]?.id;
    const sel = rows.find(r=>r.id===progEx);
    const pts = progEx ? entriesFor(progEx).filter(e=>doneSets(e.it).length).map(e=>({x:parseISO(e.s.date).getTime(), y:topOf(e.it), flag:(+e.it.pain||0)>=4})) : [];
    body = `<div class="card chart"><div class="row between" style="margin-bottom:6px"><h3 style="margin:0">Top ${sel&&sel.un==='s'?'hold':sel&&sel.un==='reps'?'reps':'weight'} over time</h3></div>
      <select class="txt" data-in="progex" style="margin-bottom:8px">${rows.map(r=>`<option value="${esc(r.id)}" ${r.id===progEx?'selected':''}>${esc(r.day)} · ${esc(r.nm)}</option>`).join('')}</select>
      ${lineChart(pts,{label:'Top weight', unit: sel? (sel.un==='s'?'s':' '+sel.un) : ''})}<div class="tiny dim">Amber dots = pain 4 or higher that session.</div></div>
      <div class="card"><h3>All exercises</h3><table class="t"><thead><tr><th>Exercise</th><th>Best</th><th>Last</th><th>#</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.id===progEx?'sel':''}" data-a="pickex" data-id="${esc(r.id)}"><td><span class="dim small">${esc(r.day)}</span> ${esc(r.nm)}</td><td>${r.best==null?'–':fmtW(r.best)+(r.un==='s'?'s':r.un==='reps'?'<span class="dim tiny"> r</span>':'')}</td><td>${r.last==null?'–':fmtW(r.last)+(r.un==='s'?'s':r.un==='reps'?'<span class="dim tiny"> r</span>':'')}</td><td>${r.n}</td></tr>`).join('')}
      </tbody></table><div class="tiny dim" style="margin-top:8px">Best and last = top weight per session (${U()}). Bodyweight moves show reps (r) and holds show seconds (s). # = sessions logged.</div></div>`;
  }
  return `<header class="top"><div><h1>Progress</h1><div class="sub">${S.sessions.length} workouts logged</div></div></header>${seg}${body}`;
}

function saveEx(id){
  const name = $('#eName').value.trim(); if(!name){ toast('Name required'); return; }
  const num = (sel, def) => { const v = parseFloat($(sel).value); return isNaN(v) ? def : v; };
  const data = {name, day:$('#eDay').value, sets:Math.max(1,Math.round(num('#eSets',3))), repMin:Math.max(1,Math.round(num('#eMin',10))), repMax:Math.max(1,Math.round(num('#eMax',12))), inc:Math.max(0,num('#eInc',0)),
    timed:$('#eTimed').checked, side:$('#eSide').checked, bw:$('#eBw').checked, main:$('#eMain').checked, joint:$('#eJoint').checked, mode:$('#eMode').value, help:$('#eHelp').value.trim(), startW:Math.max(0,num('#eStart',0)), caution:$('#eCaution').value.trim(), video:$('#eVideo').value.trim(), cues:$('#eCues').value.split('\n').map(x=>x.trim()).filter(Boolean)};
  if(data.repMax < data.repMin) data.repMax = data.repMin;
  if(data.video && !ytId(data.video)) { toast('That doesn’t look like a YouTube link'); return; }
  if(id){
    const e = exById(id);
    if(ytId(data.video) !== ytId(e.video)){ data.vtitle=''; data.vchan=''; }
    if(e.name !== name && entriesFor(id).length && confirm('Is this a DIFFERENT exercise (a swap)?\n\nOK = new exercise with fresh progression (old history kept separately).\nCancel = same exercise, just renamed.')){
      const idx = S.exercises.indexOf(e); const ne = Object.assign({}, e, data, {id: uid()}); S.exercises.splice(idx, 1, ne);
    } else Object.assign(e, data);
  } else S.exercises.push(Object.assign({id:uid()}, data));
  save(); closeModal(); render(); toast('Saved');
}

    <li>Get <b>every exercise and the stationary bike</b> cleared by your surgeon or PT, especially at 3 weeks post knee surgery.</li>
    <li><b>No leg loading</b> until your PT clears you. Day D stays locked until then.</li>
    <li>No kneeling or half-kneeling until your knee is cleared. The app uses standing versions (landmine press, Pallof press, cable lift) and no kneeling stretches.</li>
    <li>Suitcase carries: do a standing hold (or seated grip hold) until your knee is fine walking under load.</li></ul></div>
  <div class="card safety"><h2>Stop rules</h2><ul>
    <li>Stop the exercise if you get sharp pain, numbness, tingling, or pain that radiates down an arm.</li>
    <li>Pain <b>4/10 or higher</b> = no weight increase next time (the app handles this automatically). If it keeps happening, talk to your PT.</li>
    <li>Knee swelling or pain after the bike: back off, and tell your PT if it lasts.</li></ul></div>
  <div class="card safety"><h2>Neck (cervical fusion) precautions</h2><ul>
    <li>No heavy overhead barbell pressing, shrugs, upright rows, <b>neck bridges</b>, or anything that loads your head or neck.</li>
    <li>Landmine press is an angled press, not straight overhead. Keep it light and stop if your neck complains.</li>
    <li>Pulldowns go to the <b>front</b> only, never behind the neck.</li>
    <li>Keep your chin neutral: no craning to see the mirror, no jutting your head forward to “help” a rep.</li>
    <li>Keep your head supported on pads and benches, and don’t strain your neck to sit up with dumbbells.</li>
    <li>Grip hangs and scap pull-ups: keep your feet supported and step down. Never drop.</li>
    <li>Mobility: gentle, pain-free neck range of motion only. <b>Never force-stretch a fused neck.</b></li>
    <li>Neck isometrics and the Cuban press are off, or very light, unless your surgeon clears them.</li>
    <li>Carries and pinches: shoulders level and down, with no shrugging.</li>
    <li>On the mats: tell partners about your neck, avoid stacking and neck cranks, and tap early.</li></ul></div>
  <div class="card safety"><h2>Progression rules</h2><ul>
    <li><b>Weeks 1-2:</b> easy. Leave 3-4 reps in reserve.</li>
    <li><b>Main lift first</b> each day at 4 × 6-8, then accessories at 3 × 8-12 (holds in seconds).</li>
    <li><b>Double progression:</b> when you hit the top of the rep range on all sets with good form (and pain stays under 4), add the increment next session. Otherwise, keep the same weight.</li>
    <li><b>Deload every 6th week</b> (weeks 6, 12, 18…): use about 70% of your working weight.</li>
    <li>Increments: 5 lb for main lifts, 2.5-5 lb for accessories. Holds build +5s up to the top of the range, and loaded holds then add weight. Bodyweight/band moves progress by tempo or band. All editable in Settings.</li></ul></div>
  <div class="card safety"><h2>Your data</h2><ul><li>Everything is stored only on this phone, in this browser. Export a JSON backup from Settings regularly.</li>
    <li>Form clips you record are never saved in the app.</li><li>Demo videos stream from YouTube and need internet. Everything else works offline.</li></ul></div>`;
}

/* ---------- PROGRAM ---------- */
function vProgram(){
  const w = curWeek(); const bs = bikeSuggest();
  return `<header class="top"><div class="row"><button class="iconbtn" data-a="go" data-v="home" aria-label="Back">${ICONS.back}</button><div><h1>Program</h1><div class="sub">Strength + grappling · Week ${w}</div></div></div>${modeTag()}</header>
  <div class="card small"><b>How it works:</b> the main lift (★) comes first at 4 × 6-8, then accessories at 3 × 8-12, plus 2-3 joint-health lifts (⛨) each day. <b>Strength</b> mode uses classic hypertrophy accessories, and <b>BJJ</b> mode swaps in grappling carryover (frames, gi grips, rotational core, carries, and holds, each with a mat note); main lifts, progress, and history are shared. Every lifting day finishes with an easy bike spin from your bike ramp. Mobility and Balance & Core can be standalone sessions or add-ons. Weeks 1-2 are easy (3-4 reps in reserve). Hit the top of the range on every set with pain under 4, and the app adds the increment next time. Every 6th week is a deload at 70%.</div>
  ${modeSeg()}
  ${['A','B','C','D','M','K'].map(d => { const locked = d==='D' && !S.settings.ptCleared; return `<div class="card ${locked?'locked-card':''}">
    <div class="row"><div class="daybadge">${DAYS[d].section?(d==='M'?'🧘':'⚖️'):d}</div><div class="grow"><b>${esc(dayName(d))}</b>${locked?' <span class="pill">🔒 PT clearance</span>':''}</div></div>
    ${descLine(d, 'small', 'margin:8px 0 4px')}
    <table class="t"><tbody>${exercisesForDay(d).map(e=>`<tr><td>${e.main?'<b style="color:var(--green)">★</b> ':''}${e.joint?'<span style="color:#93c5fd">⛨</span> ':''}${esc(e.name)}${e.help&&curMode()==='bjj'?`<div class="tiny matnote">🥋 ${esc(e.help)}</div>`:''}${e.caution?`<div class="tiny" style="color:var(--amber)">${esc(e.caution)}</div>`:''}</td><td style="white-space:nowrap">${e.sets} × ${e.repMin===e.repMax?e.repMax:e.repMin+'-'+e.repMax}${e.timed?'s':''}${e.side?'/side':''}</td></tr>`).join('')}
      ${isLiftDay(d)?`<tr class="bikeline"><td>🚴 Finish with the bike<div class="tiny dim">From your bike ramp; logs straight to the bike log</div></td><td style="white-space:nowrap">${esc(bikeFinishText(bs))}</td></tr>`:''}</tbody></table></div>`; }).join('')}
  <div class="card"><h2>Suggested week</h2><table class="t"><tbody>
    <tr><td>Mon</td><td>Day A · ${esc(dayName('A'))} + bike finisher</td></tr><tr><td>Tue</td><td>Jiu-jitsu (or bike 10-20 min)<div class="tiny" style="color:#b7d9c4">Bike optional: a few easy minutes as a knee warm-up</div></td></tr>
    <tr><td>Wed</td><td>Day B · ${esc(dayName('B'))} + bike finisher</td></tr><tr><td>Thu</td><td>Jiu-jitsu (or bike)<div class="tiny" style="color:#b7d9c4">Bike optional: a few easy minutes as a knee warm-up</div></td></tr>
    <tr><td>Fri</td><td>Day C · ${esc(dayName('C'))} + bike finisher</td></tr><tr><td>Sat</td><td>Bike or open mat (easy)</td></tr><tr><td>Sun</td><td>Rest</td></tr></tbody></table>
    <div class="tiny dim" style="margin-top:8px">Lift A / B / C on nonconsecutive days. Shift days around your class schedule, and avoid Day B (heavy grip) right before hard rolling. Add Day D only after PT clearance.</div></div>`;
}

/* Settings list: slot defaults (both modes), the variation in use, anything with history, and custom exercises. */
function settingsList(d){ return exercisesForDay(d, true).filter(e => !e.slot || e.std || e.mach || slotOK(e) || entriesFor(e.id).length); }

/* ---------- events ---------- */
const A = {
  go: el => go(el.dataset.v),
  start: el => startWorkout(el.dataset.day),
  pt: (el, ev) => { ev.preventDefault(); const on = !S.settings.ptCleared;
    if(on && !confirm('Confirm: your PT has cleared you to start loading your legs?\n\nStart light, use limited range, and follow your PT’s limits.')) return;
    S.settings.ptCleared = on; save(); render(); toast(on ? 'Day D unlocked' : 'Day D locked'); },
  wt: el => { const it = S.current.items[+el.dataset.i]; const s = it.sets[+el.dataset.j]; s.w = Math.max(0, round25((+s.w||0) + (+el.dataset.d)*stepOf(it))); s.manual = true; if(it.feel) it.manualAfterFeel = true;
    if(+el.dataset.j===0) it.sets.forEach((x,k)=>{ if(k>0 && !x.done) x.w = s.w; }); save(); rerenderCard(+el.dataset.i); },
  rep: el => { const it = S.current.items[+el.dataset.i]; const s = it.sets[+el.dataset.j]; s.r = Math.max(0, (+s.r||0) + (+el.dataset.d)); save(); rerenderCard(+el.dataset.i); },
  done: el => { const i=+el.dataset.i, j=+el.dataset.j; const s = S.current.items[i].sets[j]; s.done = !s.done; save(); rerenderCard(i); if(s.done){ if(navigator.vibrate) navigator.vibrate(30); startRest(); } },
  addset: el => { const it = S.current.items[+el.dataset.i]; const l = it.sets[it.sets.length-1]; it.sets.push({w:l?l.w:0, r:l?l.r:it.repMin, done:false}); save(); rerenderCard(+el.dataset.i); },
  rmset: el => { const it = S.current.items[+el.dataset.i]; if(it.sets.length>1){ it.sets.pop(); save(); rerenderCard(+el.dataset.i); } },
  hold: el => { const i=+el.dataset.i, j=+el.dataset.j; const it = S.current.items[i];
    if(holdT && holdT.i===i && holdT.j===j){ const secs = Math.round((Date.now()-holdT.start)/1000); holdT=null; it.sets[j].r = secs; it.sets[j].done = true; save(); rerenderCard(i); startRest(); return; }
    if(holdT){ toast('Finish the current hold first'); return; } unlockAudio(); holdT = {i, j, start:Date.now(), target:+it.sets[j].r||it.repMin, beeped:false}; rerenderCard(i); },
  restadj: el => { const c=S.current; c.rest = Math.max(15, Math.min(600, c.rest + (+el.dataset.d))); save(); $('#restlen').textContent = c.rest+'s'; },
  reststart: () => { unlockAudio(); startRest(); },
  restplus: el => { const c=S.current; if(!c.restEnd) return; c.restEnd = Math.max(Date.now(), c.restEnd) + (+el.dataset.d)*1000; if(c.restEnd>Date.now()) c.restBeeped=false; save(); renderRest(); },
  restskip: () => { if(S.current){ S.current.restEnd=null; save(); } renderRest(); },
  finish: () => finishWorkout(),
  mode: el => setMode(el.dataset.m),
  machonly: (el, ev) => { ev.preventDefault(); setMachinesOnly(!S.settings.machinesOnly); },
  swap: el => openSwap(el.dataset.ex, el.dataset.i),
  swappick: el => swapPick(el.dataset.slot, el.dataset.id, el.dataset.i),
  swapok: () => swapScope(),
  swapcancel: () => swapStep(''),
  swapscope: el => { if(swapCtx) pickSwap(swapCtx.slot, swapCtx.id, swapCtx.i, el.dataset.scope); },
  swapreset: el => resetSlot(el.dataset.slot, el.dataset.i),
  bikefinish: () => { const c = S.current; if(!c) return; const min = +$('#bfMin').value, res = +$('#bfRes').value, knee = +$('#bfKnee').value;
    if(!(min > 0)){ toast('Enter minutes'); return; }
    const r = logBikeRide(min, Math.max(1, res||1), knee, 'Finisher after Day '+c.day); c.bikeRideId = r.id; save(); render();
    const el = $('#bikeFinish'); if(el) el.scrollIntoView({block:'center'});
    toast(knee >= 4 ? 'Ride saved. Knee flagged; take it easy' : 'Ride saved to your bike log 🚴'); },
  bikeundo: () => { const c = S.current; if(!c || !c.bikeRideId) return; S.bike = S.bike.filter(b => b.id !== c.bikeRideId); c.bikeRideId = null; save(); render(); toast('Bike log entry removed'); },
  neckiso: (el, ev) => { ev.preventDefault(); const on = !S.settings.neckIsoCleared;
    if(on && !confirm('Only turn this on if your SURGEON has explicitly cleared gentle neck isometrics after your fusion. Continue?')) return;
    S.settings.neckIsoCleared = on; save(); render(); },
  addon: el => addOn(el.dataset.day),
  feel: el => applyFeel(+el.dataset.i, el.dataset.f),
  discard: () => { if(confirm('Discard this workout? Nothing will be saved.')){ S.current=null; holdT=null; save(); keepAwake(false); go('home'); } },
  watch: el => openWatch(el.dataset.ex),
  record: el => startRecord(el.dataset.ex, el.dataset.i),
  speed: el => { const v = $('#myclip'); if(v){ v.playbackRate = +el.dataset.r; if(v.paused) v.play().catch(()=>{}); } el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===el)); },
  share: () => shareClip(),
  closemodal: () => closeModal(),
  modalbg: (el, ev) => { if(ev.target === el) closeModal(); },
  bstep: el => { const f = $('#'+el.dataset.f); f.value = Math.max(0, (+f.value||0) + (+el.dataset.d)); },
  bikesave: () => { const min = +$('#bMin').value, res = +$('#bRes').value; if(!(min>0)){ toast('Enter minutes'); return; }
    S.bike.push({id:uid(), date:$('#bDate').value||todayISO(), t:new Date().toISOString(), min, res, rpm: $('#bRpm').value? +$('#bRpm').value : null, knee:+$('#bKnee').value, notes:$('#bNotes').value.trim()});
    save(); render(); toast(+$('#bKnee')?.value>=4 ? 'Saved. Knee flagged; take it easy' : 'Ride saved 🚴'); },
  bikedel: el => { if(confirm('Delete this ride?')){ S.bike = S.bike.filter(b=>b.id!==el.dataset.id); save(); render(); } },
  seg: el => { progSeg = el.dataset.s; render(); },
  pickex: el => { progEx = el.dataset.id; render(); },
  sessdel: el => { if(confirm('Delete this workout from history? This changes future suggestions.')){ S.sessions = S.sessions.filter(s=>s.id!==el.dataset.id); save(); render(); } },
  restdef: el => { S.settings.restDefault = Math.max(15, Math.min(600, (+S.settings.restDefault||90) + (+el.dataset.d))); save(); render(); },
  bikeres: el => { S.settings.bikeStartRes = Math.max(1, (+S.settings.bikeStartRes||2) + (+el.dataset.d)); save(); render(); },
  exedit: el => openExEditor(el.dataset.id),
  exsave: el => saveEx(el.dataset.id),
  exdel: el => { if(confirm('Remove this exercise from the program? Past history is kept.')){ S.exercises = S.exercises.filter(e=>e.id!==el.dataset.id); save(); closeModal(); render(); } },
  exmove: el => { const e = exById(el.dataset.id); const same = settingsList(e.day); const k = same.indexOf(e); const o = same[k + (+el.dataset.d)]; if(!o) return;
    const a = S.exercises.indexOf(e), b = S.exercises.indexOf(o); [S.exercises[a], S.exercises[b]] = [S.exercises[b], S.exercises[a]]; save(); render(); },
  exdefaults: () => { if(confirm('Restore the default exercise list? Custom exercises will be removed. History is kept.')){ S.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES)); save(); render(); toast('Default program restored'); } },
  export: () => exportData(),
  import: () => { const i = $('#importInput'); i.value=''; i.click(); },
  reset: () => { if(!confirm('Reset ALL data (workouts, bike rides, settings)? Export a backup first if you want to keep it.')) return;
    if(!confirm('Are you sure? This cannot be undone.')) return; localStorage.removeItem(KEY); S = freshState(); holdT=null; go('home'); onboarding(); },
  obdone: () => { S.settings.startDate = $('#obDate').value || todayISO(); save(); closeModal(); render(); },
  a2hsdone: () => { localStorage.setItem(KEY+'.a2hs','1'); closeModal(); }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if(!el) return;
  const tab = el.closest('nav.tabs'); unlockAudio();
  const fn = A[el.dataset.a]; if(fn) fn(el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target; const k = el.dataset && el.dataset.in; if(!k) return;
  const c = S.current;
  if(k==='pain'){ const i=+el.dataset.i; c.items[i].pain = +el.value; const pv=$('#pv-'+i); pv.textContent=el.value+'/10'; pv.style.color=painColor(+el.value); save(); }
  else if(k==='notes'){ c.items[+el.dataset.i].notes = el.value; save(); }
  else if(k==='bfknee'){ const v = +el.value, lab = $('#bfKneeV'); if(lab){ lab.textContent = v+'/10'; lab.style.color = painColor(v); } }
});
document.addEventListener('change', ev => {
  const el = ev.target; const k = el.dataset && el.dataset.in;
  if(el.id==='recInput'){ const f = el.files && el.files[0]; if(f && recCtx) openCompare(f); return; }
  if(el.id==='importInput'){ const f = el.files && el.files[0]; if(f) importData(f); return; }
  if(!k) return; const c = S.current;
  if(k==='pain'){ rerenderCard(+el.dataset.i); }
  else if(k==='w'){ const it=c.items[+el.dataset.i], j=+el.dataset.j; const v=parseFloat(el.value); const nv = isNaN(v)?0:Math.max(0,v); if(it.sets[j].w===nv) return;
    it.sets[j].w = nv; it.sets[j].manual = true; if(it.feel) it.manualAfterFeel = true; if(j===0) it.sets.forEach((x,k)=>{ if(k>0 && !x.done) x.w = nv; }); save(); rerenderCard(+el.dataset.i); }
  else if(k==='r'){ const it=c.items[+el.dataset.i]; const v=parseInt(el.value,10); const nv = isNaN(v)?0:Math.max(0,v); if(it.sets[+el.dataset.j].r===nv) return; it.sets[+el.dataset.j].r = nv; save(); rerenderCard(+el.dataset.i); }
  else if(k==='startDate'){ if(el.value){ S.settings.startDate = el.value; if(S.current){ S.current.week = weekOf(S.current.date); S.current.deload = isDeload(S.current.week); } save(); render(); toast('Start date updated'); } }
  else if(k==='progex'){ progEx = el.value; render(); }
});
document.querySelector('nav.tabs').addEventListener('click', ev => { const b = ev.target.closest('button[data-tab]'); if(b) go(b.dataset.tab); });

/* ---------- export / import ---------- */
function exportData(){
  const data = JSON.stringify(Object.assign({app:'jeremy-workouts', exportedAt:new Date().toISOString()}, S), null, 2);
  const name = `jeremy-workouts-backup-${todayISO()}.json`;
  const blob = new Blob([data], {type:'application/json'});
  try{ const f = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.share && navigator.canShare({files:[f]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){ navigator.share({files:[f], title:'Workout backup'}).catch(()=>{}); return; } }catch(e){}
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Backup exported');
}
function importData(file){
  const rd = new FileReader();
  rd.onload = () => { try{
      const d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.exercises) || !Array.isArray(d.sessions)) throw new Error('Not a Jeremy’s Workouts backup');
      if(!confirm(`Import backup with ${d.sessions.length} workouts and ${(d.bike||[]).length} rides? This REPLACES the data on this phone.`)) return;
      delete d.app; delete d.exportedAt; localStorage.setItem(KEY, JSON.stringify(d)); S = load(); render(); toast('Backup imported');
    }catch(e){ alert('Import failed: '+e.message); } };
  rd.readAsText(file);
}

/* ---------- first launch ---------- */
const isStandalone = () => window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
function onboarding(){
  if(S.settings.startDate) return a2hsTip();
  openModal(`<div style="text-align:center;font-size:44px">💪</div><h2 style="text-align:center">Welcome, Jeremy</h2>
    <p class="small muted" style="text-align:center">Your upper-body program with auto-progression, bike tracker, and form videos, all on your phone.</p>
    <label class="f">Program start date (week 1)</label><input type="date" class="txt" id="obDate" value="${todayISO()}">
    <div class="banner amber" style="margin-top:12px"><div class="ico">⚕️</div><div class="small"><b>Safety first</b>Get every exercise and the bike cleared by your surgeon or PT. Stop on pain. Neck-safe only: no heavy overhead barbell work, shrugs, or upright rows. Legs stay locked until PT clears you. This is a log, not medical advice.</div></div>
    ${isStandalone()?'':`<div class="banner blue"><div class="ico">📲</div><div class="small"><b>Make it an app</b>In Safari, tap <b>Share</b> <span aria-hidden="true">⬆︎</span>, then <b>Add to Home Screen</b>. It opens full-screen like a real app.</div></div>`}
    <button class="btn primary" data-a="obdone" id="obBtn">I understand, let’s go</button>`);
  localStorage.setItem(KEY+'.a2hs','1');
}
function a2hsTip(){
  if(isStandalone() || localStorage.getItem(KEY+'.a2hs')) return;
  openModal(`<h2>📲 Add to Home Screen</h2><p class="small muted">Tap the <b>Share</b> button in Safari, then <b>Add to Home Screen</b>. You’ll get a full-screen app icon, and your data stays on this phone.</p><button class="btn primary" data-a="a2hsdone">Got it</button>`);
}

/* ---------- timers ---------- */
setInterval(() => {
  if(S.current && S.current.restEnd) renderRest();
  if(holdT){ const el = $('#hold-'+holdT.i+'-'+holdT.j); const secs = Math.floor((Date.now()-holdT.start)/1000);
    if(el) el.textContent = '■ '+secs+' / '+holdT.target+'s'; if(!holdT.beeped && secs >= holdT.target){ holdT.beeped = true; beep(2); } }
}, 250);
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && S.current) keepAwake(true); });

/* ---------- optional service worker (only if a sw.js is hosted next to this file) ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  fetch('sw.js', {method:'HEAD'}).then(r => { if(r.ok) navigator.serviceWorker.register('sw.js').catch(()=>{}); }).catch(()=>{});
}

["home","lift","bike","chart","gear"].forEach(k => { const s = document.getElementById("ic-"+k); if(s) s.outerHTML = ICONS[k]; });
render();
onboarding();
if(S.current) keepAwake(true);

</script>
